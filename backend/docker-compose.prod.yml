version: "3.8"

services:
  api-gateway:
    build:
      args:
        ENVIRONMENT: production
        PORT: 4000
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      PORT: 4000
    depends_on:
      - rabbitmq
      - redis
    volumes:
      - /home/oth_proj/gfi_uploads:/app/api-gateway/uploads

  auth-service:
    build:
      args:
        ENVIRONMENT: production
        PORT: 4001
    ports:
      - "4001:4001"
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 4001
      PORT: 4001
    depends_on:
      - rabbitmq
    volumes:
      - /home/oth_proj/gfi_uploads:/app/auth-service/uploads

  # insurance-service:
  #   build:
  #     args:
  #       ENVIRONMENT: sandbox
  #       PORT: 4002
  #   ports:
  #     - "4002:4002"
  #   environment:
  #     NODE_ENV: sandbox
  #     INSURANCE_SERVICE_PORT: 4002
  #     PORT: 4002
  #   depends_on:
  #     - rabbitmq
  onboarding-service:
    build:
      args:
        ENVIRONMENT: production
        PORT: 4003
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: production
      ONBOARDING_SERVICE_PORT: 4003
      PORT: 4003
    depends_on:
      - rabbitmq
    volumes:
      - /home/oth_proj/gfi_uploads:/app/onboarding-service/uploads

  background-jobs:
    build:
      args:
        ENVIRONMENT: production
        PORT: 4004
    ports:
      - "4004:4004"
    environment:
      NODE_ENV: production
      BACKGROUND_JOBS_PORT: 4004
      PORT: 4004
    depends_on:
      - rabbitmq
    volumes:
      - /home/oth_proj/gfi_uploads:/app/background-jobs/uploads
      - /home/oth_proj/gfi_downloads:/app/background-jobs/downloads

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
