                              isDeleted:
                                type: boolean
                                example: false
                              isSelected:
                                type: boolean
                                example: false
                              createdBy:
                                type: integer
                                example: 1
                              updatedBy:
                                type: integer
                                example: 1
                              createdDate:
                                type: string
                                format: date-time
                                example: "2023-03-22T12:34:56Z"
                              updatedDate:
                                type: string
                                format: date-time
                                example: "2023-03-22T12:34:56Z"
        "400":
          description: Invalid request
        "401":
          description: Access denied. No credentials sent!
        "500":
          description: Internal server error

  /api/onboarding/updateAgent:
