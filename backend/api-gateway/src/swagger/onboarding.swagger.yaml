  /api/master/createCarrier:
    post:
      summary: Create a new carrier
      description: >
        Creates a new carrier with optional logo/image upload. Also associates states, products, and documents.
      tags:
        - Master
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - carrierName
                - carrierCode
                - countryCompanyId
                - displayName
                - carrierDesc
                - countryId
                - email
                - siteUrl
                - surelcCarrierCode
                - updatedBy
                - allSelectedStates
                - carrierProductLine
                - carrierDocument
                - file
              properties:
                carrierName:
                  type: string
                  example: "ABC Insurance"
                displayName:
                  type: string
                  example: "ABC"
                carrierDesc:
                  type: string
                  example: "Carrier that provides general liability insurance"
                carrierCode:
                  type: string
                  example: "ABC123"
                countryCompanyId:
                  type: integer
                  example: 1
                countryId:
                  type: integer
                  example: 1
                email:
                  type: string
                  format: email
                  example: contact@abcinsurance.com
                siteUrl:
                  type: string
                  format: uri
                  example: https://www.abcinsurance.com
                surelcCarrierCode:
                  type: string
                  example: "SURE-ABC"
                updatedBy:
                  type: integer
                  example: 1
                allSelectedStates:
                  type: string
                  example: "[1, 2, 3]"  # JSON string
                  description: JSON stringified array of state IDs
                carrierProductLine:
                  type: string
                  example: "[4, 5]"  # JSON string
                  description: JSON stringified array of carrier product line IDs
                carrierDocument:
                  type: string
                  example: "[101, 102]"  # JSON string
                  description: JSON stringified array of carrier document IDs
                file:
                  type: string
                  format: binary
                  description: Optional image/logo file (JPG, PNG, GIF)
      responses:
        '200':
          description: Carrier created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Carrier created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 101
                      name:
                        type: string
                        example: "ABC Insurance"
                      code:
                        type: string
                        example: "ABC123"
                      icon:
                        type: string
                        example: "https://s3.amazonaws.com/bucket-name/CAR_123456789.png"
        '400':
          description: Missing required fields or invalid file type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Missing required fields: carrierName, carrierCode, or countryCompanyId.
        '500':
          description: Internal server error during carrier creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error creating carrier
                  error:
                    type: string
                    example: Error message

  /api/admin/createAnnouncementOrNotification:
    post:
      security:
        - bearerAuth: []
      summary: Create an announcement or notification
      description: |
        Create a new announcement or notification for a specific company/country.  
        - Announcements may have a start and expiry date.  
        - Content type can be either plain text or rich content (HTML/URL).  
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - type
                - content
                - contentType
                - countryCompanyId
              properties:
                title:
                  type: string
                  example: "System Maintenance Scheduled"
                description:
                  type: string
                  example: "We will be performing system maintenance on Sunday."
                startedOn:
                  type: string
                  format: date-time
                  example: "2025-08-20T10:00:00Z"
                expiresOn:
                  type: string
                  format: date-time
                  example: "2025-08-20T18:00:00Z"
                type:
                  type: string
                  enum: [NTFC, ANCM]
                  example: "ANCM"
                content:
                  type: string
                  example: "<p>The system will be down for scheduled maintenance.</p>"
                contentType:
                  type: string
                  enum: [TEXT, URL]
                  example: "URL"
                countryCompanyId:
                  type: integer
                  example: 101
      responses:
        "200":
          description: Announcement/Notification created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Announcement created successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      title:
                        type: string
                        example: "System Maintenance Scheduled"
                      description:
                        type: string
                        example: "We will be performing system maintenance on Sunday."
                      startedOn:
                        type: string
                        format: date-time
                        example: "2025-08-20T10:00:00Z"
                      expiresOn:
                        type: string
                        format: date-time
                        example: "2025-08-20T18:00:00Z"
                      type:
                        type: string
                        example: "ANCM"
                      content:
                        type: string
                        example: "<p>The system will be down for scheduled maintenance.</p>"
                      contentType:
                        type: string
                        example: "URL"
                      countryCompanyId:
                        type: integer
                        example: 101
                      createdBy:
                        type: integer
                        example: 12
                      createdDate:
                        type: string
                        format: date-time
                        example: "2025-08-18T16:00:00Z"
        "400":
          description: Invalid request payload
        "401":
          description: Unauthorized - No credentials provided
        "404":
          description: Announcement not created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Announcement not created"
        "500":
          description: Internal server error
          content:
