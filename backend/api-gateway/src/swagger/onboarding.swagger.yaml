                        contentType:
                          type: string
                          example: "URL"
                        countryCompanyId:
                          type: integer
                          example: 101
                        startedOn:
                          type: string
                          format: date-time
                          example: "2025-08-20T10:00:00Z"
                        expiresOn:
                          type: string
                          format: date-time
