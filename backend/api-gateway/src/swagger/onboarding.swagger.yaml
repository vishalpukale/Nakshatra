                    type: boolean
                    example: false
                  errorDetails:
                    type: string
                    example: "Internal server error"
        "400":
          description: Invalid request
        "401":
          description: Unauthorized - missing or invalid token
        "500":
          description: Internal server error

  /api/onboarding/getTutorials/{countryCompanyId}:
