                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Onboarding not succeeded.
                  status: processing
        "500":
          description: Server error while processing onboarding
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error message from server"
