    get:
      security:
        - bearerAuth: []
      summary: Get announcements and notifications list
      description: |
        Retrieve announcements/notifications with pagination and sorting.
        - Applies `isDeleted = false` internally.
        - `search` performs a case-insensitive match on `title`.
      tags:
        - Admin
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Case-insensitive search on announcement title
          example: "maintenance"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Page number (1-based)
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
          required: false
          description: Items per page
        - in: query
          name: field
          schema:
            type: string
            enum: [id, title, startedOn, expiresOn, type]
            default: id
          required: false
          description: Column to sort by
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          required: false
          description: Sort direction
      responses:
        "200":
          description: Announcements fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
