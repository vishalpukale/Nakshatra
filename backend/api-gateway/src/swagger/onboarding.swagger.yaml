      description: Fetches a list of agents based on hierarchy level, search, and date filters. Applies masking to sensitive fields like SSN and NPN.
      tags:
        - Compliance Agents
      parameters:
        - name: type
          in: query
          description: Filter based on agent hierarchy (e.g., PERSONAL, BASE, SUPER_BASE)
          required: false
          schema:
            type: string
            example: BASE
        - name: search
          in: query
          description: Search keyword for first name, last name, email, or code
          required: false
          schema:
            type: string
            example: john
        - name: startDate
          in: query
          description: Filter agents created on or after this date (ISO format)
          required: false
          schema:
            type: string
            format: date
            example: 2024-01-01
        - name: endDate
          in: query
          description: Filter agents created on or before this date (ISO format)
          required: false
          schema:
            type: string
            format: date
            example: 2024-12-31
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            example: 1
        - name: pageSize
          in: query
          description: Number of agents per page
          required: false
          schema:
            type: integer
            example: 10
        - name: field
          in: query
          description: Field to sort the results by
          required: false
          schema:
