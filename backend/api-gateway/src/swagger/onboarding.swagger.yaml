      description: Creates a new agent certificate entry. Accepts form fields and a PDF file upload.
      tags:
        - Profile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - agentId
                - certificateTypeId
                - courseName
                - providerName
                - courseId
                - completionDate
                - certificateUrl
              properties:
                agentId:
                  type: integer
                  example: 1
                  description: Agent ID
                certificateTypeId:
                  type: integer
                  example: 1
                  description: Certificate Type ID
                jobExecutionId:
                  type: integer
                  example: 2001
                  description: Job Execution ID (optional)
                courseName:
                  type: string
                  example: Workplace Safety Basics
                  description: Name of the training course
                courseNumber:
                  type: string
                  example: WSB-2025-01
                  description: Course number (optional)
                providerName:
                  type: string
                  example: SafeWork Institute
                  description: Name of the certificate provider
                courseId:
                  type: string
                  example: SWI-WSB-101
                  description: Course identifier
                completionDate:
                  type: string
                  format: date
                  example: 2025-05-14
                  description: Date of course completion
                expirationDate:
                  type: string
                  format: date
                  example: 2026-05-14
                  description: Optional expiration date
                createdBy:
                  type: integer
                  example: 5001
                  description: User ID who created the entry (optional)
                updatedBy:
                  type: integer
                  example: 5001
                  description: User ID who last updated the entry (optional)
                certificateUrl:
                  type: string
                  format: binary
                  description: Certificate PDF file
      responses:
        "201":
          description: Successfully created the Agent Certificate
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Agent Certificate Created Successfully
                  agent:
                    $ref: "#/components/schemas/AgentCertificate"
        "400":
          description: Bad Request (e.g., missing required fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Certificate file is required
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error while creating certificate agent
                  error:
                    type: string
                    example: Internal server error

