  /api/admin/updateBackOfficeUser:
    put:
      security:
        - bearerAuth: []
      summary: Update back office user
      description: Update back office user details and access permissions. Supports both simple status updates and complex multi-country access management.
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  description: ID of the user to update
                  example: 1
                userAccess:
                  type: array
                  description: Array of access groups defining user permissions (optional for status updates)
                  items:
                    type: object
                    properties:
                      countryId:
                        type: integer
                        example: 1
                      moduleTypeId:
                        type: integer
                        example: 1
                      moduleIds:
                        type: array
                        items:
                          type: integer
                        example: [1, 2, 3]
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                firstName:
                  type: string
                  example: "John"
                lastName:
                  type: string
                  example: "Doe"
                mobile:
                  type: string
                  example: "9876543210"
                middleName:
                  type: string
                  example: "A"
                userTypeId:
                  type: integer
                  example: 1
                countryId:
                  type: integer
                  example: 1
                stateId:
                  type: integer
                  example: 1
                countryPhoneCode:
                  type: string
                  example: "+1"
                status:
                  type: string
                  example: "active"
                avatar:
                  type: string
                  example: "https://example.com/avatar.jpg"
                isActive:
                  type: boolean
                  description: User account active status
                  example: true
      responses:
        "200":
          description: Back office user updated successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "User status updated successfully."
                      data:
                        $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Back Office User updated successfully."
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          description: Bad Request - Validation error or user not found
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "User ID is required."
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "User not found or not updated."
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Email already used."
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Missing or invalid required field."
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Foreign key constraint failed."
        "401":
          description: Unauthorized - missing or invalid token
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
