                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                dob:
                  type: string
                  format: date
                  example: "1990-01-15"
                maritalStatus:
                  type: string
                  example: "Single"
                code:
                  type: string
                  example: "AGT12345"
                roleId:
                  type: integer
                  example: 1
                reference:
                  type: string
                  example: "REF12345"
                ssn:
                  type: string
                  example: "123-45-6789"
                npn:
                  type: string
                  example: "NPN12345"
                address:
                  type: string
                  example: "123 Main St, Springfield"
                countryId:
                  type: integer
                  example: 1
                stateId:
                  type: integer
                  example: 1
                zipCode:
                  type: string
                  example: "12345"
                cityId:
                  type: integer
                  example: 1
                onboardingPosition:
                  type: integer
                  example: 1
                contractingPosition:
                  type: integer
                  example: 1
                status:
                  type: string
                  example: "active"
                isDeleted:
                  type: boolean
                  example: false
                createdBy:
                  type: integer
                  example: 1
                updatedBy:
                  type: integer
                  example: 1
                createdDate:
                  type: string
                  format: date-time
                  example: "2023-03-22T12:34:56Z"
                updatedDate:
                  type: string
                  format: date-time
                  example: "2023-03-22T12:34:56Z"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Agent's Basic detail updated successfully."
                  data:
                    type: object
                    example:
                      id: 1
                      firstName: "John"
                      lastName: "Doe"
                      email: "john.doe@example.com"
                      dob: "1990-01-15"
                      maritalStatus: "Single"
                      code: "AGT12345"
                      roleId: 1
                      reference: "REF12345"
                      ssn: "123-45-6789"
                      npn: "NPN12345"
                      address: "123 Main St, Springfield"
                      countryId: 1
                      stateId: 1
                      zipCode: "12345"
                      cityId: 1
                      onboardingPosition: 1
                      contractingPosition: 1
                      status: "active"
                      isDeleted: false
                      createdBy: 1
                      updatedBy: 1
