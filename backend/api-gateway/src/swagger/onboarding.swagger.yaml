  /api/agent/certificateByCode/{code}:
    get:
      summary: Get Latest Agent Certificate by Certificate Code
      description: |
        Fetches the latest agent certificate associated with a specific certificate code. 
        The certificate must not be marked as deleted (`isDeleted: false`). 
        This endpoint joins the `agent_certificate` and `certificate_type` tables and returns 
        the most recent certificate entry based on the `createdDate` field.
      tags:
        - Profile
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
            example: AML
          description: The code of the certificate type to filter by.
      responses:
        "200":
          description: Successfully fetched the latest Agent Certificate by code
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Latest certificate fetched successfully by code
                  certificate:
                    $ref: "#/components/schemas/AgentCertificate"
        "404":
          description: No certificate found for the given code
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: No certificate found for the provided code
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error fetching certificate by code
                  error:
                    type: string
                    example: Error message describing the issue

