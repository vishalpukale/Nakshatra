  /api/admin/getAllAgentLicenses:
    get:
      security:
        - bearerAuth: []
      summary: Get all agent licenses
      description: >
        Retrieve a paginated and filterable list of agent licenses, supporting
        search, date range, status, state, and sorting by various fields.
      tags:
        - Admin
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search by license number, LOA, agent name, email, or code
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Current page number
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Number of records per page
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter licenses expiring after this date (YYYY-MM-DD)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter licenses expiring before this date (YYYY-MM-DD)
        - in: query
          name: status
          schema:
            type: object
            properties:
              name:
                type: string
                enum: [ACT, EXPS, EXP]
                example: ACT
          description: Status-based filter (ACT, EXPS, EXP)
        - in: query
          name: stateId
          schema:
            type: string
          description: Filter by license state ID
        - in: query
          name: field
          schema:
            type: string
            example: "email"
          description: Field to sort by (e.g. email, stateName, agentCode, agent)
        - in: query
          name: sortDirection
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort direction
      responses:
        "200":
          description: Successfully retrieved license list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: License List fetched successfully
                  count:
                    type: integer
                    example: 42
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "12345"
                        licenseNum:
                          type: string
                          example: "LIC123456"
                        loa:
                          type: string
                          example: "Life & Health"
                        expires:
                          type: string
                          format: date
                          example: "2025-09-30"
                        licensedOn:
                          type: string
                          format: date
                          example: "2022-01-01"
                        agentFirstName:
                          type: string
                          example: "John"
                        agentLastName:
                          type: string
                          example: "Doe"
                        agentEmail:
                          type: string
                          example: "john.doe@example.com"
                        title:
                          type: string
                          example: "Mr."
                        npn:
                          type: string
                          example: "789123"
                        agentCode:
                          type: string
                          example: "A001"
                        stateName:
                          type: string
                          example: "Texas"
                        licenseUrl:
                          type: string
                          format: uri
                          example: "https://backend.com/files/license123.pdf"
                        file:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: "license123.pdf"
                              type:
                                type: string
                                example: "image/png"
                              size:
                                type: integer
                                example: 0
                              preview:
                                type: string
                                format: uri
                                example: "https://backend.com/files/license123.pdf"
        "404":
          description: No licenses found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: License not found
        "500":
          description: Server error while fetching license list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error fetching License List
                  error:
                    type: string
                    example: Database connection failed
