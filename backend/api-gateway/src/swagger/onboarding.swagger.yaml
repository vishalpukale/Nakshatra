  /api/agent/updateStateLicense:
    put:
      security:
        - bearerAuth: []
      summary: Update or create state licenses for an agent
      description: Updates existing licenses or creates new licenses for the agent. Allows image upload for license documents.
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - licenses
                - agentId
              properties:
                agentId:
                  type: integer
                  example: 123
                  description: Agent ID to associate with the licenses
                licenses:
                  type: array
                  description: List of licenses to update or create
                  items:
                    type: object
                    required:
                      - licenseTypeId
                      - licensedOn
                      - licenseNum
                      - expires
                      - state
                    properties:
                      id:
                        type: integer
                        example: 45
                        description: License ID (if updating)
                      licenseTypeId:
                        type: integer
                        example: 2
                      agentId:
                        type: integer
                        example: 123
                        description: Optional. Overrides global agentId
                      licensedOn:
                        type: string
                        format: date
                        example: "2024-01-15"
                      licenseNum:
                        type: string
                        example: "LIC456789"
                      expires:
                        type: string
                        format: date
                        example: "2026-01-15"
                      state:
                        oneOf:
                          - type: object
                            properties:
                              code:
                                type: string
                                example: "TX"
                          - type: string
                            example: "TX"
                        description: License state (code string or object with code)
                      residentialState:
                        type: object
                        properties:
                          code:
                            type: integer
                            example: 1
                        description: Used to determine if this is the resident state
                      status:
                        type: string
                        example: "Active"
                      loa:
                        type: string
                        example: "LIFE"
                      updatedBy:
                        type: integer
                        example: 5
                      file:
                        type: array
                        description: Optional license document as image
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: "license.jpg"
                            type:
                              type: string
                              example: "image/jpeg"
                            file:
                              type: object
                              properties:
                                buffer:
                                  type: string
                                  format: byte
                                  example: "<base64-encoded-binary>"
      responses:
        "200":
          description: Licenses processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Successfully processed 3 licenses"
                  data:
                    type: array
                    items:
                      type: object
                      description: License object returned from DB
                  errors:
                    type: array
                    description: Errors for any licenses that failed processing
                    items:
                      type: object
                      properties:
                        licenseNum:
                          type: string
                          example: "LIC123456"
                        error:
                          type: string
                          example: "Invalid file format. Only images are allowed"
        "400":
          description: Invalid request format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request format. Expected array of licenses"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error while processing licenses"
                  error:
                    type: string
                    example: "Unexpected token < in JSON"
