  /api/master/update-carrier/{id}:
    put:
      summary: Update carrier details by ID
      description: >
        Updates a carrier's information including name, code, display name, description, contact info, states, product lines, documents, and icon (image file).  
        Also supports toggling the carrier's status with minimal input (`isActive` only).
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Carrier ID
          schema:
            type: integer
            example: 10
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                carrierName:
                  type: string
                  example: "Aetna"
                carrierDesc:
                  type: string
                  example: "National Insurance Provider"
                carrierCode:
                  type: string
                  example: "AET"
                displayName:
                  type: string
                  example: "Aetna Inc."
                email:
                  type: string
                  format: email
                  example: "info@aetna.com"
                siteUrl:
                  type: string
                  format: uri
                  example: "https://www.aetna.com"
                countryCompanyId:
                  type: integer
                  example: 1
                surelcCarrierCode:
                  type: string
                  example: "SLC-AET"
                isActive:
                  type: boolean
                  example: true
                updatedBy:
                  type: integer
                  example: 1
                countryId:
                  type: integer
                  example: 1
                allSelectedStates:
                  type: string
                  description: JSON stringified array of state IDs
                  example: "[1, 2, 3]"
                carrierProductLine:
                  type: string
                  description: JSON stringified array of product line IDs
                  example: "[101, 102]"
                carrierDocument:
                  type: string
                  description: JSON stringified array of document IDs
                  example: "[201, 202]"
                file:
                  type: string
                  format: binary
                  description: Image file for the carrier icon
      responses:
        '200':
          description: Carrier updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Carrier updated successfully
                  data:
                    $ref: '#/components/schemas/Carrier'
        '400':
          description: Validation error or no fields provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: No fields to update. Please provide at least one valid field or a new image.
        '404':
          description: Carrier not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Carrier not found
        '500':
          description: Error updating carrier
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error updating carrier
                  error:
                    type: string
                    example: Internal server error occurred

