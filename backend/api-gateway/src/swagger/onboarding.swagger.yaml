openapi: 3.0.0
info:
  title: Onboarding Management API
  description: API for managing onboarding
  version: 1.0.0

servers:
  - url: http://localhost:3003
    description: Claims server
    variables:
      port:
        default: "3003" # Fix port here to match the server URL

paths:
  /api/onboarding/createAgent:
    post:
      summary: Create agent
      description: Create a new agent entry.
      tags:
        - Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Agent"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid request

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Internal server error"
                  errorDetails:
                    type: string
                    example: "Internal server error"

  /api/onboarding/verifyReferenceCode:
    post:
      summary: Verify Agent Reference Code
      description: Verifies whether a given reference code is valid for an agent.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              items: "#/components/schemas/Agent"
              properties:
                reference:
                  type: string
                  example: "REF20250412"
      responses:
        "200":
          description: Reference code is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  succes:
                    type: boolean
                    example: true
                  agentId:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: "John Doe"
                  referenceCode:
                    type: string
                    example: "REF20250412"
        "400":
          description: Invalid reference code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid reference code
        "401":
          description: Unauthorized - missing or invalid token
        "500":
          description: Internal server error

  /api/onboarding/verifySSNNumber:
    post:
      summary: Verify Agent SSN Number
      description: Verifies whether a given SSN number belongs to a registered agent.
      tags:
        - Onboarding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ssnNumber
              properties:
                ssnNumber:
                  type: string
                  example: "123-45-6789"
                  description: Social Security Number in the format XXX-XX-XXXX
                companyId:
                  type: integer
                  example: 2
                userId:
                  type: integer
                  example: 1
      responses:
        "200":
          description: SSN number is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  agentId:
                    type: integer
                    example: 42
                  message:
                    type: string
                    example: SSN number is valid
        "400":
          description: SSN is already associated with other user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid SSN number
        "401":
          description: Unauthorized - missing or invalid token
        "500":
          description: Internal server error

  /api/onboarding/getBasicDetailById/{userId}:
    get:
      security:
        - bearerAuth: []
      summary: Get basic detail by user ID
      description: Retrieve a list of basic detail by user ID.
      tags:
        - Onboarding
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data fetched successfully"
                  data:
                    type: object
                    example:
                      id: 1
                      userId: 101
                      supervisorAgentId: 5
                      firstName: "John"
                      middleName: "A."
                      lastName: "Doe"
                      email: "john.doe@example.com"
                      dob: "1985-08-15"
                      maritalStatus: "Single"
                      code: "AGT123"
                      roleId: 3
                      reference: "REF456"
                      ssn: "123-45-6789"
                      npn: "NPN987654"
                      address: "123 Elm Street"
                      countryId: 1
                      stateId: 2
                      zipCode: "90210"
                      cityId: 3
                      onboardingPosition: 1
                      contractingPosition: 1
                      status: "active"
                      isDeleted: false
                      createdBy: 101
                      updatedBy: 102
                      createdDate: "2024-01-01T10:00:00Z"
                      updatedDate: "2024-04-01T12:30:00Z"
                      country:
                        id: 1
                        name: "Canada"
                        code: "CA"
                        isDeleted: false
                        isActive: true
                        createdBy: 1
                        updatedBy: 1
                        createdDate: "2025-04-09T14:37:49.752Z"
                        updatedDate: "2025-04-09T14:37:49.752Z"
                      state:
                        id: 2
                        countryId: 1
                        name: "Quebec"
                        code: "QC"
                        isDeleted: false
                        isActive: true
                        createdBy: 1
                        updatedBy: 1
                        createdDate: "2025-04-09T14:42:35.941Z"
                        updatedDate: "2025-04-09T14:42:35.941Z"

        "400":
          description: Invalid request

        "404":
          description: User Id not found
        "500":
          description: Internal Server Error

  /api/onboarding/getAgentDashboardData/{userId}:
    get:
      security:
        - bearerAuth: []
      summary: Get agent dashboard data
      description: Retrieve a list of agent dashboard data by user ID.
      tags:
        - Onboarding
      parameters:
        - name: userId
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dashboard data retrieved successfully"
                  data:
                    type: object
                    example:
                      companyName: "Company Name"
                      countryName: "Country Name"
                      onboardingProgress: 50
                      contractProgress: 50
                      quickLinks:
                        - id: 1
                          title: "Quick Link 1"
                          url: "https://www.google.com"
                        - id: 2
                          title: "Quick Link 2"
                          url: "https://www.google.com"
                        - id: 3
                          title: "Quick Link 3"
                          url: "https://www.google.com"

