  /api/agent/updateAgentProfile:
    put:
      summary: Update Agent Profile
      description: Updates the profile details of an agent, including personal info, address, and triggers SureLC account creation if needed.
      tags:
        - Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Agent's unique ID
                userId:
                  type: integer
                  description: User's unique ID
                identificationCode:
                  type: string
                  description: Agent identification code
                firstName:
                  type: string
                lastName:
                  type: string
                middleName:
                  type: string
                maritalStatus:
                  type: string
                npn:
                  type: string
                  description: National Producer Number
                onboardingPosition:
                  type: string
                roleId:
                  type: integer
                  default: 1
                ssn:
                  type: string
                mailingAddress:
                  type: string
                mailingCountryId:
                  type: integer
                mailingStateId:
                  type: integer
                mailingZipCode:
                  type: string
                mailingCityId:
                  type: integer
                email:
                  type: string
                  format: email
                updatedBy:
                  type: string
                  description: User who performed the update
                toVerify:
                  type: boolean
                  description: Whether to trigger SureLC verification
                residentialState:
                  type: integer
                  description: Residential state ID (used if toVerify is true)
                mobile:
                  type: string
                  description: Mobile phone number (used for SureLC)
                suffix:
                  type: string
                  description: Name suffix (used for SureLC)
              required:
                - id
                - userId
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  agents:
                    type: object
                    description: Updated agent profile and address info
                  userData:
                    type: object
                    description: Updated user data
                  isAgentCreatedToSureLc:
                    type: boolean
        "400":
          description: Verification error (SureLC)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string

