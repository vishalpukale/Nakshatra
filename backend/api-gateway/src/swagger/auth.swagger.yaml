  /api/master/createAdvertise:
    post:
      summary: Create a new advertisement
      description: Create a new advertisement with thumbnail and optional image file uploads. Requires authentication.
      tags:
        - Master
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - countryCompanyId
                - title
                - forScreen
                - startedOn
                - expiresOn
              properties:
                countryCompanyId:
                  type: string
                  description: ID of the country company
                  example: "12345"
                imageUrl:
                  type: string
                  description: URL of the image (required if isLocalImage is false)
                  example: "https://example.com/image.jpg"
                title:
                  type: string
                  description: Title of the advertisement
                  example: "Summer Sale"
                subTitle:
                  type: string
                  description: Subtitle of the advertisement
                  example: "Up to 50% off"
                description:
                  type: string
                  description: Description of the advertisement
                  example: "Don't miss our biggest sale of the year!"
                forScreen:
                  type: string
                  description: Screen identifier where the advertisement will be displayed
                  example: "login"
                isLocalImage:
                  type: boolean
                  description: Whether to use a local uploaded image file
                  example: true
                startedOn:
                  type: string
                  format: date
                  description: Start date of the advertisement (YYYY-MM-DD)
                  example: "2024-07-01"
                expiresOn:
                  type: string
                  format: date
                  description: Expiry date of the advertisement (YYYY-MM-DD)
                  example: "2024-08-01"
                thumbnailFile:
                  type: string
                  format: binary
                  description: Thumbnail image file (optional)
                imageFile:
                  type: string
                  format: binary
                  description: Advertisement image file (required if isLocalImage is true)

      responses:
        "200":
          description: Advertisement created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Advertisement created successfully."
                  data:
                    $ref: "#/components/schemas/Advertise"

        "400":
          description: Bad Request - File upload or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Failed to save thumbnail: Invalid file format"

        "401":
          description: Unauthorized - Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Authentication required"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error creating advertisement."
                  error:
                    type: string
                    example: "Database connection failed"
                      
  /api/master/getAllAdvertise:
    get:
      summary: Get all advertisements
      description: Retrieve a list of all advertisements.
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: forScreen
          in: query
          required: false
          schema:
            type: string
            example: login
          description: Filter advertisements by screen

      responses:
        "200":
          description: Advertise fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Advertise fetched successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Advertise"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error fetching advertisements"
                  error:
                    type: string
                    example: "Database connection failed"

  /api/master/getAllAdvertiseByScreen:
    get:
      summary: Get all advertisements by screen
      description: Retrieve a list of all active advertisements for a specific screen that are currently valid (within start and expiry dates).
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: forScreen
          in: query
          required: true
          schema:
            type: string
            example: login
          description: The screen identifier for which advertisements should be retrieved

      responses:
        "200":
          description: Advertisements fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Advertisements fetched successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Advertise"

        "400":
          description: Bad Request - forScreen parameter is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "forScreen is required"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error fetching advertisements"
                  error:
                    type: string
                    example: "Database connection failed"
                    
  /api/master/getAdvertiseByCountryCompanyId:
    get:
      security:
        - bearerAuth: []
      summary: Get advertisements by country and company ID
      description: Retrieve a list of advertisements filtered by the specified country and company ID.
      tags:
        - Master
      parameters:
        - name: id
          in: query
          required: true
          description: The combined country and company ID or a unique identifier for the query.
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Advertisements fetched successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Advertise"
        "400":
          description: Bad Request - id parameter is required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "id parameter is required"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error fetching advertisements"
                  error:
                    type: string
                    example: "Database connection failed"

  /api/master/updateAdvertise/{id}:
    put:
      summary: Update Advertisement
      description: Update an existing advertisement. Supports both form fields and file uploads (thumbnail and image). At least one field must be provided for update.
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the advertisement to update
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                countryCompanyId:
                  type: string
                  description: ID of the country company
                  example: "12345"
                imageUrl:
                  type: string
                  description: External URL of the image (cannot be a local path unless uploaded via imageFile)
                  example: "https://example.com/image.jpg"
                title:
                  type: string
                  description: Title of the advertisement
                  example: "Summer Sale"
                subTitle:
                  type: string
                  description: Subtitle of the advertisement
                  example: "Up to 50% off"
                description:
                  type: string
                  description: Description of the advertisement
                  example: "Don't miss our biggest sale of the year!"
                forScreen:
                  type: string
                  description: Screen identifier where the advertisement will be displayed
                  example: "login"
                isActive:
                  type: boolean
                  description: Whether the advertisement is currently active
                  example: true
                startedOn:
                  type: string
                  format: date
                  description: Start date of the advertisement (YYYY-MM-DD)
                  example: "2024-07-01"
                expiresOn:
                  type: string
                  format: date
                  description: Expiry date of the advertisement (YYYY-MM-DD)
                  example: "2024-08-01"
                thumbnailFile:
                  type: string
                  format: binary
                  description: Thumbnail image file (optional). If provided, will replace existing thumbnail
                imageFile:
                  type: string
                  format: binary
                  description: Advertisement image file (optional). If provided, will replace existing image and set isLocalImage to true
      responses:
        "200":
          description: Advertisement updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Advertisement updated successfully."
                  data:
                    $ref: "#/components/schemas/Advertise"
        "400":
          description: Bad Request - Validation error or no fields to update
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "No fields to update. Please provide at least one valid field or a new thumbnail/image."
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Failed to update thumbnail: Invalid file format"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "Failed to update image: Invalid file format"
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "imageUrl cannot be a local path unless uploaded via imageFile."
        "404":
          description: Advertisement not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Advertisement not found"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error updating advertisement."
                  error:
                    type: string
                    example: "Database connection failed"



  /api/master/deleteAdvertise/{id}:
    delete:
      summary: Delete an advertisement by ID
      description: Remove an advertisement from the system. Requires authentication. Accepts a deletion reason as a query parameter.
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the advertisement to delete
          schema:
            type: integer
        - name: deletionReason
          in: query
          required: false
          description: Reason for deleting the advertisement
          schema:
            type: string
      responses:
        "200":
          description: Advertisement deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Advertise deleted successfully
                  data:
                    type: object
                    description: The deleted advertise data
        "400":
          description: Missing advertisement ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Advertise Id is required
        "401":
          description: Unauthorized - missing or invalid token
        "500":
          description: Error in deleting advertise
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error in deleting advertise
                  error:
                    type: string
                    example: Error message

  /api/master/getAllCompany:
    get:
      security:
        - bearerAuth: []
      summary: Get all companies
      description: Retrieve a list of all companies.
      tags:
        - Master
      responses:
        "200":
          description: Company fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Company fetched successfully"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"

        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal Server Error"

  /api/master/getCompanyById/{id}:
    get:
      summary: Get company by ID
      description: Retrieve details of a company by its ID.
      tags:
        - Master
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the company to retrieve
          schema:
            type: integer
      responses:
        "200":
          description: Company retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
