openapi: 3.0.0
info:
  title: Backend API
  description: API for managing users
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: AUTH server
    variables:
      port:
        default: "3001"
        description: API server port

paths:
  /api/auth/signInAsAdmin:
    post:
      summary: Admin login
      description: Authenticate user using email and password.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "vimal@margmaker.com"
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5c..."
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      mobile:
                        type: string
                        example: "9876543210"
        "400":
          description: Invalid request or wrong credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User not found"
        "500":
          description: Server error

  /api/auth/signInAsAgent:
    post:
      summary: Agent login
      description: Authenticate agent user using user ID, contact information, and optional OTP.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: "9876543210"
                otp:
                  type: string
                  example: "123456"
                countryPhoneCode:
                  type: string
                  example: "+1"
                email:
                  type: string
                  example: "example@gmail.com"
      responses:
        "200":
          description: Successful agent login
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Agent login successful"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkFkbWluIFVzaGVyIiwiaWF0IjoxNTE2MjM5MDIyfQ.DysoUn0sJ4OdRHVdFst3TfM4y69IQ8ALpIboF9Lq5hZ"
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                          firstName:
                            type: string
                            example: "John"
                          lastName:
                            type: string
                            example: "Doe"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid request"
                  errorDetails:
                    type: string
                    example: "Invalid request"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Internal server error"
                  errorDetails:
                    type: string
                    example: "Internal server error"

  /api/auth/updateAdminPassword:
    post:
      summary: Update Admin Password
      description: Allows an admin user to update their password by providing the current and new passwords.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password updated successfully"
        "400":
          description: Invalid request or wrong current password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Current password is incorrect"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Internal server error"

  /api/auth/sendOtpToAgent:
    post:
      summary: Send OTP to agent
      description: Send OTP to agent using mobile number or email.
      tags:
        - OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: "9876543210"
                email:
                  type: string
                  example: "example@gmail.com"
        responses:
          "200":
            description: OTP sent successfully
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: "OTP sent successfully"
                    data:
                      type: object
                      properties:
                        userId:
                          type: integer
                          example: 1
                        contact:
                          type: string
                          example: "9876543210"
                        status:
                          type: string
                          example: "OTP sent successfully"
          "400":
            description: Missing or invalid contact (mobile number or email)
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: boolean
                      example: true
                    message:
                      type: string
                      example: "Mobile number or email is required"
          "500":
            description: Server error
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    error:
                      type: boolean
                      example: true
                    message:
                      type: string
                    errorDetails:
                      type: string
                      example: "Internal server error"

  /api/auth/createAgentAccount:
    post:
      summary: Create agent account
      description: Create a new agent account.
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Internal server error"
                  errorDetails:
                    type: string
                    example: "Internal server error"
  /api/auth/{id}:
    get:
      summary: Get user by ID
      description: Retrieve details of a user by their ID.
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
        "500":
          description: Internal Server Error

    put:
      summary: Update user by ID
      description: Update details of an existing user.
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
        "404":
          description: User not found
        "500":
          description: Internal Server Error

    delete:
      summary: Delete user by ID
      description: Remove a user from the system.
      tags:
        - Authentication
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "204":
          description: User deleted successfully
        "404":
          description: User not found
        "500":
          description: Internal Server Error

