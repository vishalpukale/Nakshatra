components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication
  schemas:
    Advertise:
        type: object
        properties:
          id:
            type: integer
            description: Unique identifier for the advertisement
            example: 1
          countryCompanyId:
            type: integer
            description: ID of the country company
            example: 1
          imageUrl:
            type: string
            description: URL or path to the advertisement image
            example: "https://fastly.picsum.photos.com/800/600"
          thumbnailUrl:
            type: string
            description: URL or path to the thumbnail image
            example: "/uploads/advertise_images/THUMBNAIL_1234567890.jpg"
          title:
            type: string
            description: Title of the advertisement
            example: "This is a title"
          subTitle:
            type: string
            description: Subtitle of the advertisement
            example: "This is a sub-title"
          description:
            type: string
            description: Description of the advertisement
            example: "This is a detailed description of the advertisement"
          forScreen:
            type: string
            description: Screen identifier where the advertisement will be displayed
            example: "login"
          isDeleted:
            type: boolean
            description: Whether the advertisement is deleted
            example: false
          isLocalImage:
            type: boolean
            description: Whether the image is stored locally
            example: false
          createdBy:
            type: integer
            description: ID of the user who created the advertisement
            example: 1
          updatedBy:
            type: integer
            description: ID of the user who last updated the advertisement
            example: 1
          createdDate:
            type: string
            format: date-time
            description: Timestamp when the advertisement was created
            example: "2023-03-22T12:34:56Z"
          updatedDate:
            type: string
            format: date-time
            description: Timestamp when the advertisement was last updated
            example: "2023-03-22T12:34:56Z"
          isActive:
            type: boolean
            description: Whether the advertisement is active
            example: true
          startedOn:
            type: string
            format: date
            description: Start date of the advertisement
            example: "2023-03-22"
          expiresOn:
            type: string
            format: date
            description: Expiry date of the advertisement
            example: "2023-04-22"
    Agent:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        supervisorAgentId:
          type: integer
          example: 1
        code:
          type: string
          example: "AGT12345"
        reference:
          type: string
          example: "REF20250812"
        ssn:
          type: string
          example: "123-456-789"
        stateId:
          type: integer
          example: 1
        countryId:
          type: integer
          example: 1
        isActive:
          type: boolean
          example: true
        createdBy:
          type: integer
          example: 1
        updatedBy:
          type: integer
          example: 1
        createdDate:
          type: string
          format: date-time
          example: "2023-03-22T12:34:56Z"
        updatedDate:
          type: string
          format: date-time
          example: "2023-03-22T12:34:56Z"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john.doe@example.com"
        createdDate:
          type: string
          format: date-time
          example: "2023-03-22T12:34:56Z"
        updatedDate:
          type: string
          format: date-time
          example: "2023-03-22T12:34:56Z"

    Country:
