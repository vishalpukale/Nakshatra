version: "3.8"

services:
  api-gateway:
    build:
      args:
        ENVIRONMENT: development
        PORT: 3000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_GATEWAY_PORT: 3000
      PORT: 3000
    volumes:
      - /home/oth_proj/gfi_uploads:/app/api-gateway/uploads

  auth-service:
    build:
      args:
        ENVIRONMENT: development
        PORT: 3001
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      AUTH_SERVICE_PORT: 3001
      PORT: 3001
    volumes:
      - /home/oth_proj/gfi_uploads:/app/auth-service/uploads

  # insurance-service:
  #   build:
  #     args:
  #       ENVIRONMENT: development
  #       PORT: 3002
  #   ports:
  #     - "3002:3002"
  #   environment:
  #     NODE_ENV: development
  #     INSURANCE_SERVICE_PORT: 3002
  #     PORT: 3002

  onboarding-service:
    build:
      args:
        ENVIRONMENT: development
        PORT: 3003
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      ONBOARDING_SERVICE_PORT: 3003
      PORT: 3003
    volumes:
      - /home/oth_proj/gfi_uploads:/app/onboarding-service/uploads
  background-jobs:
    build:
      args:
        ENVIRONMENT: development
        PORT: 3004
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: development
      BACKGROUND_JOBS_PORT: 3004
      PORT: 3004
    volumes:
      - /home/oth_proj/gfi_uploads:/app/background-jobs/uploads
      - /home/oth_proj/gfi_downloads:/app/background-jobs/downloads
